name: Installer checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          for file in installer/*.sh; do
            echo "Checking ${file}"
            bash -n "${file}"
          done

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -x -e SC1091 install.sh installer/*.sh

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in setup/*.php; do
            echo "Checking ${file}"
            php -l "${file}"
          done

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile system/setupd.py
